<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="theme-color" content="#FFFAF3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1E2A44" media="(prefers-color-scheme: dark)" />
    <title>%WEB_TITLE%</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      /* 1.4.27 (Tester 1.4.26 browser pass): the native splash does not exist on the web, so a hard reload showed a
         blank white page until the bundle ran. The page now starts on the splash colours (app.config.ts expo-splash-screen:
         Day #FFFAF3, Night #1E2A44), so the first paint matches the theme. */
      html,
      body {
        background-color: #FFFAF3;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background-color: #1E2A44;
        }
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
