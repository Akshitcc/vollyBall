# Local stack: MySQL 8.4 + the API. Values are placeholders; put real ones in server/.env (not committed).
#   cd server && cp .env.example .env   # then edit
#   docker compose up --build
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: volleylive
      MYSQL_USER: volleylive
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-CHANGE_ME}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-CHANGE_ME_ROOT}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql-init.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: server/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: mysql://volleylive:${MYSQL_PASSWORD:-CHANGE_ME}@mysql:3306/volleylive
      MIGRATE_ON_START: "1"
      STORAGE_DIR: /data/uploads
    ports:
      - "4000:4000"
    volumes:
      - uploads:/data/uploads
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
  uploads:
